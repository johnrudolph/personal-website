<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>OG</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Geist:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet" />
<style>
  :root{
    --paper: oklch(0.18 0.012 70);
    --paper-2: oklch(0.22 0.014 70);
    --ink: oklch(0.95 0.012 80);
    --ink-2: oklch(0.78 0.012 80);
    --ink-3: oklch(0.58 0.012 80);
    --rule: oklch(0.95 0.012 80 / 0.16);
    --accent: oklch(0.78 0.14 70);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1200px;height:630px;overflow:hidden}
  body{
    background:var(--paper);color:var(--ink);
    font-family:"Geist",ui-sans-serif,system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .card{
    width:1200px;height:630px;
    display:grid;grid-template-columns:1.45fr 1fr;
    padding:72px 72px;gap:64px;align-items:center;
    position:relative;
  }
  .brand{
    position:absolute;top:48px;left:72px;
    display:flex;align-items:center;gap:12px;
    font-family:"IBM Plex Mono",ui-monospace,monospace;
    font-size:13px;letter-spacing:.06em;color:var(--ink-2);
  }
  .brand .dot{width:9px;height:9px;border-radius:50%;background:var(--accent)}
  .meta{
    position:absolute;bottom:48px;left:72px;
    display:flex;gap:28px;
    font-family:"IBM Plex Mono",ui-monospace,monospace;
    font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);
  }
  .meta span{display:inline-flex;align-items:center;gap:10px}
  .meta span::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent)}
  h1{
    font-family:"Newsreader",ui-serif,Georgia,serif;
    font-weight:400;
    font-size:74px;line-height:1.02;letter-spacing:-0.022em;
    color:var(--ink);text-wrap:balance;
  }
  h1 em{font-style:italic;color:var(--ink-2)}
  .photo{
    width:100%;aspect-ratio:4/5;
    border-radius:6px;overflow:hidden;
    background:var(--paper-2);
    box-shadow:0 24px 80px rgba(0,0,0,.45);
  }
  .photo img{
    width:100%;height:100%;object-fit:cover;display:block;
    filter:saturate(.92) contrast(1.02);
  }
</style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <span class="dot"></span>
      <span>JOHN&nbsp;RUDOLPH&nbsp;DREXLER</span>
    </div>
    <h1>
      Most dev teams don&rsquo;t need a <em>full-time</em> Product Manager.
    </h1>
    <div class="photo">
      <img src="/images/headshot.png" alt="" />
    </div>
    <div class="meta">
      <span>Fractional PM</span>
      <span>NYC</span>
      <span>1 client slot open</span>
    </div>
  </div>
</body>
</html>
